# Builds the macOS installer on a macOS runner and publishes it as a GitHub
# Release. Two ways to run it:
#   - push a version tag (v1.2.3): builds that commit, attaches the DMG to the
#     release for that tag;
#   - "Run workflow" from the Actions tab (or the API): builds the chosen
#     branch, creates the tag v<version> from package.json at that commit if
#     it does not exist yet, and publishes the release for it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Work out the release tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run app:dmg
        env:
          FIXMYMIX_APP_OUT: ${{ github.workspace }}/build
      - uses: actions/upload-artifact@v4
        with:
          name: FixMyMix-installer
          path: build/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FixMyMix ${{ steps.meta.outputs.tag }}
          files: build/*.dmg
          generate_release_notes: true
